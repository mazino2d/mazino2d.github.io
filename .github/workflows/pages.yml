name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site:
    uses: mazino2d/github-workflows/.github/workflows/pages.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      generator: jekyll
