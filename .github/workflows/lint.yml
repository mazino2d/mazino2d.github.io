name: Lint

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: mazino2d/github-workflows/.github/workflows/lint.yml@v1
    with:
      markdownlint: true

  codeql:
    uses: mazino2d/github-workflows/.github/workflows/codeql-actions.yml@v1
    permissions:
      contents: read
      security-events: write
